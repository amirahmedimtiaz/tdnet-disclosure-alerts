name: Daily TDnet Check

on:
  schedule:
    - cron: '5 15 * * *'  # 15:05 UTC = 00:05 JST
  workflow_dispatch:
    inputs:
      report_date:
        description: "Optional YYYYMMDD date to re-run; blank means yesterday in JST"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tdnet-disclosure-alert
  cancel-in-progress: false

jobs:
  check-disclosures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Audit dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --requirement requirements.txt

      - name: Static checks
        run: |
          python -m pip install ruff==0.16.3
          ruff check main.py test_main.py

      - name: Run tests
        run: python -m unittest -v

      - name: Run script
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          TDNET_REPORT_DATE: ${{ inputs.report_date }}
        run: python main.py
